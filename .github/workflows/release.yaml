name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Publish Release
    runs-on: "ubuntu-latest"
    environment:
      name: pypi
      url: https://pypi.org/p/hexital
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Build package
        run: uv build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
